{% if columns.is_empty() %}
<p>No columns.</p>
{% else %}
<table>
    <thead><tr><th>Name</th><th>Type</th><th>Actions</th></tr></thead>
    <tbody>
    {% for col in columns %}
    <tr>
        <td>{{ col.name }}</td>
        <td>{{ col.col_type }}</td>
        <td>
            <button class="danger"
                    hx-delete="/api/tables/{{ table_name }}/columns/{{ col.name }}"
                    hx-target="#column-list"
                    hx-swap="innerHTML"
                    hx-confirm="Drop column '{{ col.name }}'?">
                Remove
            </button>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endif %}
